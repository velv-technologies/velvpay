name: Security and quality gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-quality-plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certification:
    name: velvpay WordPress plugin / security-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Lint tracked plugin PHP
        run: git ls-files -z -- '*.php' ':!vendor/**' | xargs -0 -r -n1 php -l
